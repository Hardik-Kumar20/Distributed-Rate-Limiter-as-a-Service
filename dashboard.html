<!DOCTYPE html>
<html>
<head>
  <title>Rate Limiter Dashboard</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial; background: #111; color: #fff; }
    canvas { background: #222; margin-top: 20px; }
    .allowed { color: #00ff88; }
    .blocked { color: #ff4d4d; }
  </style>
</head>
<body>

<h2>🔥 Rate Limiter Dashboard</h2>

<canvas id="chart" width="600" height="300"></canvas>

<ul id="logs"></ul>

<script>
  const ws = new WebSocket("ws://localhost:3000");

  const ctx = document.getElementById("chart").getContext("2d");

  let allowedCount = 0;
  let blockedCount = 0;

  const chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: "Allowed",
          data: [],
          borderColor: "#00ff88"
        },
        {
          label: "Blocked",
          data: [],
          borderColor: "#ff4d4d"
        }
      ]
    }
  });

  ws.onmessage = (event) => {
    const { data } = JSON.parse(event.data);

    // LOGS
    const li = document.createElement("li");
    li.textContent = `${data.scope} | ${data.identifier} → ${data.allowed ? "ALLOWED" : "BLOCKED"} (${data.remaining})`;
    li.className = data.allowed ? "allowed" : "blocked";
    document.getElementById("logs").prepend(li);

    // CHART
    if (data.allowed) allowedCount++;
    else blockedCount++;

    const time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(allowedCount);
    chart.data.datasets[1].data.push(blockedCount);

    chart.update();
  };
</script>

</body>
</html>
